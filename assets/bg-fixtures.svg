<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#EAF3F4"/>
    <stop offset="55%" stop-color="#D3E6E8"/>
    <stop offset="100%" stop-color="#B9D6D9"/>
  </linearGradient>
  <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.35"/>
  </linearGradient>
  <linearGradient id="counter" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"  stop-color="#F4F8F8"/>
    <stop offset="45%" stop-color="#E4EFEF"/>
    <stop offset="100%" stop-color="#CFE2E4"/>
  </linearGradient>
  <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#20535A"/>
    <stop offset="100%" stop-color="#123B41"/>
  </linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#8FB6BA"/>
    <stop offset="35%"  stop-color="#FFFFFF"/>
    <stop offset="60%"  stop-color="#B9D3D6"/>
    <stop offset="100%" stop-color="#6E9AA0"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.28" cy="0.22" r="0.55">
    <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.85"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="softer"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="crisp"><feGaussianBlur stdDeviation="1.6"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#room)"/>

<!-- window light, left -->
<g filter="url(#softer)">
  <rect x="80" y="60" width="330" height="330" rx="10" fill="url(#win)"/>
  <rect x="470" y="80" width="230" height="270" rx="10" fill="url(#win)" opacity="0.65"/>
</g>

<!-- backsplash tile, soft -->
<g filter="url(#soft)" opacity="0.5">
  <rect x="60" y="300" width="88" height="36" rx="4" fill="#FFFFFF" opacity="0.55"/><rect x="158" y="300" width="88" height="36" rx="4" fill="#FFFFFF" opacity="0.55"/><rect x="256" y="300" width="88" height="36" rx="4" fill="#FFFFFF" opacity="0.55"/><rect x="354" y="300" width="88" height="36" rx="4" fill="#FFFFFF" opacity="0.55"/><rect x="452" y="300" width="88" height="36" rx="4" fill="#FFFFFF" opacity="0.55"/><rect x="550" y="300" width="88" height="36" rx="4" fill="#FFFFFF" opacity="0.55"/><rect x="648" y="300" width="88" height="36" rx="4" fill="#FFFFFF" opacity="0.55"/><rect x="746" y="300" width="88" height="36" rx="4" fill="#FFFFFF" opacity="0.55"/><rect x="108" y="344" width="88" height="36" rx="4" fill="#FFFFFF" opacity="0.55"/><rect x="206" y="344" width="88" height="36" rx="4" fill="#FFFFFF" opacity="0.55"/><rect x="304" y="344" width="88" height="36" rx="4" fill="#FFFFFF" opacity="0.55"/><rect x="402" y="344" width="88" height="36" rx="4" fill="#FFFFFF" opacity="0.55"/><rect x="500" y="344" width="88" height="36" rx="4" fill="#FFFFFF" opacity="0.55"/><rect x="598" y="344" width="88" height="36" rx="4" fill="#FFFFFF" opacity="0.55"/><rect x="696" y="344" width="88" height="36" rx="4" fill="#FFFFFF" opacity="0.55"/><rect x="60" y="388" width="88" height="36" rx="4" fill="#FFFFFF" opacity="0.55"/><rect x="158" y="388" width="88" height="36" rx="4" fill="#FFFFFF" opacity="0.55"/><rect x="256" y="388" width="88" height="36" rx="4" fill="#FFFFFF" opacity="0.55"/><rect x="354" y="388" width="88" height="36" rx="4" fill="#FFFFFF" opacity="0.55"/><rect x="452" y="388" width="88" height="36" rx="4" fill="#FFFFFF" opacity="0.55"/><rect x="550" y="388" width="88" height="36" rx="4" fill="#FFFFFF" opacity="0.55"/><rect x="648" y="388" width="88" height="36" rx="4" fill="#FFFFFF" opacity="0.55"/><rect x="746" y="388" width="88" height="36" rx="4" fill="#FFFFFF" opacity="0.55"/><rect x="108" y="432" width="88" height="36" rx="4" fill="#FFFFFF" opacity="0.55"/><rect x="206" y="432" width="88" height="36" rx="4" fill="#FFFFFF" opacity="0.55"/><rect x="304" y="432" width="88" height="36" rx="4" fill="#FFFFFF" opacity="0.55"/><rect x="402" y="432" width="88" height="36" rx="4" fill="#FFFFFF" opacity="0.55"/><rect x="500" y="432" width="88" height="36" rx="4" fill="#FFFFFF" opacity="0.55"/><rect x="598" y="432" width="88" height="36" rx="4" fill="#FFFFFF" opacity="0.55"/><rect x="696" y="432" width="88" height="36" rx="4" fill="#FFFFFF" opacity="0.55"/>
</g>

<!-- upper cabinets, right of window -->
<g filter="url(#soft)" opacity="0.72">
  <rect x="900" y="90" width="300" height="240" rx="8" fill="url(#cab)"/>
  <rect x="1230" y="90" width="300" height="240" rx="8" fill="url(#cab)"/>
  <rect x="1046" y="90" width="8" height="240" fill="#0E3036" opacity="0.5"/>
  <rect x="1376" y="90" width="8" height="240" fill="#0E3036" opacity="0.5"/>
</g>

<!-- pendant lamps -->
<g filter="url(#soft)">
  <rect x="286" y="0" width="5" height="150" fill="#4A7378" opacity="0.55"/>
  <rect x="486" y="0" width="5" height="150" fill="#4A7378" opacity="0.55"/>
  <path d="M 240,205 a 48,48 0 0 1 96,0 z" fill="#2C5F66" opacity="0.8"/>
  <path d="M 440,205 a 48,48 0 0 1 96,0 z" fill="#2C5F66" opacity="0.8"/>
  <ellipse cx="288" cy="225" rx="30" ry="10" fill="#FFF6DC" opacity="0.9"/>
  <ellipse cx="488" cy="225" rx="30" ry="10" fill="#FFF6DC" opacity="0.9"/>
</g>

<!-- counter slab -->
<g filter="url(#crisp)">
  <rect x="0" y="520" width="1600" height="44" fill="url(#counter)"/>
  <rect x="0" y="564" width="1600" height="10" fill="#A9C7CB" opacity="0.55"/>
</g>

<!-- base cabinetry -->
<g filter="url(#soft)">
  <rect x="0" y="574" width="1600" height="326" fill="url(#cab)"/>
  <g opacity="0.35" fill="#0B2A2F">
    <rect x="300" y="574" width="7" height="326"/>
    <rect x="640" y="574" width="7" height="326"/>
    <rect x="980" y="574" width="7" height="326"/>
    <rect x="1320" y="574" width="7" height="326"/>
  </g>
  <g fill="#9FC4C8" opacity="0.55">
    <rect x="140" y="640" width="90" height="7" rx="3"/>
    <rect x="820" y="640" width="90" height="7" rx="3"/>
    <rect x="1160" y="640" width="90" height="7" rx="3"/>
  </g>
</g>

<!-- undermount sink void -->
<g filter="url(#crisp)" opacity="0.55">
  <rect x="330" y="564" width="260" height="120" rx="14" fill="#0E3036"/>
</g>

<!-- HERO: gooseneck faucet, the sharpest object in frame -->
<g filter="url(#crisp)">
  <path d="M 452,520 L 452,470 Q 452,326 546,326 Q 636,326 636,404 L 636,452"
        fill="none" stroke="url(#metal)" stroke-width="19" stroke-linecap="round"/>
  <rect x="618" y="450" width="36" height="22" rx="5" fill="url(#metal)"/>
  <rect x="424" y="500" width="56" height="24" rx="6" fill="url(#metal)"/>
  <path d="M 392,520 L 392,494 Q 392,482 404,482 L 424,482"
        fill="none" stroke="url(#metal)" stroke-width="11" stroke-linecap="round"/>
  <circle cx="386" cy="490" r="11" fill="url(#metal)"/>
</g>
<g opacity="0.75">
  <ellipse cx="636" cy="500" rx="4" ry="12" fill="#DFF4F6"/>
  <ellipse cx="636" cy="540" rx="3" ry="9"  fill="#DFF4F6"/>
</g>

<!-- right: vessel basin + tall tap, softer (depth of field) -->
<g filter="url(#soft)">
  <rect x="1120" y="458" width="190" height="64" rx="14" fill="#F2F9F9" opacity="0.9"/>
  <path d="M 1372,520 L 1372,404 Q 1372,392 1360,392 L 1300,392"
        fill="none" stroke="url(#metal)" stroke-width="14" stroke-linecap="round"/>
  <circle cx="1180" cy="250" r="92" fill="none" stroke="#8FB6BA" stroke-width="9" opacity="0.7"/>
</g>

<!-- warm key light + vignette -->
<rect width="1600" height="900" fill="url(#glow)"/>
<rect width="1600" height="900" fill="#0D2A2E" opacity="0.05"/>
</svg>